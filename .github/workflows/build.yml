name: Build

on:
  push:
    branches:
      - "main"
  pull_request:
    branches: 
      - "*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  BuildAll:
    runs-on: macos-26
    steps:
    - uses: actions/checkout@v6

    # Install .NET SDK
    - name: Setup .NET 10.0.x
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '10.x'

    - name: Display .NET Info
      run: 'dotnet --info'

    - name: Build All Solutions
      shell: pwsh
      run: ./BuildAllSolutions.ps1
